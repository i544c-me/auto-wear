[tools]
goreleaser = "2.12.7"
uv = "0.9.5"

[tasks.test]
description = "Run Python tests"
run = "python -m unittest discover -s tests -v"

[tasks.build]
description = "Build extension"
shell = "pwsh -c" # デフォルトでは `cmd \c` で実行されるため
run = '''
& "C:\Program Files\Blender Foundation\Blender 4.5\blender.exe" --command extension build --source-dir src
'''
